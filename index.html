<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espaço do Estudante</title>
    <link rel="stylesheet" href="src/reset.css">
    <link rel="stylesheet" href="src/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="header">
        <div class="seta">
            <a href="">
                <img src="src/images/seta-esquerda-branca.png" alt="Seta Esquerda Icon">
            </a>
        </div>
        <div>
            <img class="minha-foto" src="src/images/minhafoto.jpeg" alt="Foto Vitor Binhotti">
            <h1>Vitor Binhotti</h1>
        </div>
    </header>
    <main>
        <nav>
            <ul class="informacoes">
                <a class="btn" href="index.html">
                    <div class="gerais">
                        <img src="src/images/pessoa-icon.png" alt="Pessoa Icon">
                        <p>Gerais</p>
                    </div>
                </a>

                <a class="btn" href="#">
                    <div class="contato">
                        <img src="src/images/e-mail.png" alt="Email Icon">
                        <p>Contato</p>
                    </div>
                </a>

                <a class="btn" href="#">
                    <div class="endereco">
                        <img src="src/images/casa.png" alt="Casa Icon">
                        <p>Endereço</p>
                    </div>
                </a>

                <a class="btn" href="#">
                    <div class="senha">
                        <img src="src/images/cadeado.png" alt="Cadeado Icon">
                        <p>Senha</p>
                    </div>
                </a>

                <a class="btn" href="mensalidade.html">
                    <div class="financeiro">
                        <img src="src/images/dinheiro.png" alt="Dinheiro Icon">
                        <p>Financeiro</p>
                    </div>
                </a>
            </ul>
        </nav>

        <hr>

        <div class="input-container">
            <input type="text" id="nome" name="nome" required>
            <label for="nome">Nome</label>
        </div>
        <div class="input-container">
            <input type="text" id="nome" name="nome" required>
            <label for="nome">CPF</label>
        </div>
        <div class="input-container">
            <input type="text" id="nome" name="nome" required>
            <label for="nome">RG</label>
        </div>
        <div class="input-container">
            <input type="text" id="nome" name="nome" required>
            <label for="nome">Nascimento</label>
        </div>
        <div class="input-container">
            <input type="text" id="nome" name="nome" required>
            <label for="nome">CEP</label>
        </div>
        <div class="input-container">
            <input type="text" id="nome" name="nome" required>
            <label for="nome">Endereço</label>
        </div>

        <button class="botao-atualizar">
            Atualizar Informações
            <img src="src/images/confirme.png" alt="Confirme Icon">
        </button>
    </main>
    <div id="notificacao" class="notificacao">
        Informações atualizadas com sucesso! ✅
    </div>

    <script src="script.js"></script>
</body>

</html>
