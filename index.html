<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Espaço do Estudante</title>
    <link rel="stylesheet" href="src/reset.css">
    <link rel="stylesheet" href="src/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap"
        rel="stylesheet">
</head>

<body>
    <header class="header">
        <div class="seta">
            <a href="">
                <img src="src/images/seta-esquerda-branca.png" alt="Seta Esquerda Icon">
            </a>
        </div>
        <div>
            <img class="minha-foto" src="src/images/minhafoto.jpeg" alt="Foto Vitor Binhotti">
            <h1>Vitor Binhotti</h1>
        </div>
    </header>
    <main>
        <nav>
            <ul class="informacoes">

                <a class="btn" href="#">
                    <div class="gerais">
                        <img src="src/images/pessoa-icon.png" alt="Pessoa Icon">
                        <p>Gerais</p>
                    </div>
                </a>

                <a class="btn" href="#">
                    <div class="contato">
                        <img src="src/images/e-mail.png" alt="Email Icon">
                        <p>Contato</p>
                    </div>
                </a>

                <a class="btn" href="#">
                    <div class="endereco">
                        <img src="src/images/casa.png" alt="">
                        <p>Endereço</p>
                    </div>
                </a>

                <a class="btn" href="#">
                    <div class="senha">
                        <img src="src/images/cadeado.png" alt="">
                        <p>Senha</p>
                    </div>
                </a>
            </ul>
        </nav>
        <hr>

        <div>
            <p>Nome</p>
            <label for="text"></label>
            <input type="text">
        </div>
    </main>
</body>

</html>
